[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prod-agent"
version = "0.3.0"
description = "生产级通用任务编排 Agent — 零重型依赖,可靠性/可观测性/成本控制/安全内建"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
validation = ["jsonschema>=4"]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4"]

[tool.setuptools]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
check_untyped_defs = true
