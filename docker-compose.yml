services:
  prod-agent-server:
    build: .
    command: python -m agent serve --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment:
      PROD_AGENT_CHECKPOINT_DB: /data/agent_checkpoints.db
      PROD_AGENT_BUSINESS_DB: /data/demo_business.db
    ports:
      - "8000:8000"
    volumes:
      - prod-agent-data:/data
    restart: unless-stopped

  prod-agent-worker:
    build: .
    command: python -m agent worker
    env_file:
      - path: .env
        required: false
    environment:
      PROD_AGENT_CHECKPOINT_DB: /data/agent_checkpoints.db
      PROD_AGENT_BUSINESS_DB: /data/demo_business.db
    volumes:
      - prod-agent-data:/data
    restart: unless-stopped

volumes:
  prod-agent-data:
